[databases]
# Database configuration using individual environment variables
# Format: dbname = host=hostname port=port dbname=actual_db_name user=username password=password
voice_demo = host=${DATABASES_HOST} port=${DATABASES_PORT:-5432} dbname=${DATABASES_DB} user=${DATABASES_USER} password=${DATABASES_PASSWORD}

[pgbouncer]
# Network settings
listen_addr = 0.0.0.0
listen_port = 6432

# Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Connection pooling settings optimized for asyncpg
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

# Connection management
server_reset_query = DISCARD ALL
server_check_query = SELECT 1
server_check_delay = 30
server_lifetime = 3600
server_idle_timeout = 600

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

# Performance tuning for asyncpg
tcp_keepalive = 1
tcp_keepcnt = 3
tcp_keepidle = 600
tcp_keepintvl = 30

# Memory settings
max_packet_size = 2147483647
listen_backlog = 128
sbuf_loopcnt = 5

# Admin settings
admin_users = postgres
stats_users = postgres
